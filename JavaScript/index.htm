<html lang="zh-TW">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>ShanChi Master</title>
    <script type="text/javascript" src="book.js"></script>
    <script type="text/javascript" src="board.js"></script>
    <script type="text/javascript" src="position.js"></script>
    <script type="text/javascript" src="search.js"></script>
    <script type="text/javascript" src="cchess.js"></script>
    <script type="text/javascript" src="test.js"></script>
    <style type="text/css">
        <!--
        body {
            background: url(../background.gif);
        }

        span.td {
            display: inline-block;
        }

        div.label {
            font-size: 14px;
            padding: 2px;
        }

        select {
            font-size: 14px;
            width: 158px;
            padding: 2px;
        }

        option {
            font-size: 14px;
        }

        input.button {
            font-size: 14px;
            width: 158px;
        }

        label {
            font-size: 14px;
        }

        -->
    </style>
</head>
<body>
    <div style="text-align: center; font-size: 28px; font-family: 'Times New Roman', Times, serif"
        <img src="./images/logo.png">
    </div>
    <div style="height:16px"></div>
    <div style="text-align:center;white-space:nowrap">
        <span class="td" style="margin-right:10px">
            <div id="container"></div>
        </span><span class="td" style="vertical-align:top;width:200px;">
            <div style="text-align:left">
                <div class="label">
                    何方先出招：
                </div>
                <div>
                    <select id="selMoveMode" size="3">
                        <option selected value="0">
                            狂龍提步，一馬當先
                        </option>
                        <option value="1">
                            虎霸先躍，叱咤風雲
                        </option>
                        <option value="2">
                            亦龍亦虎，黑白無常
                        </option>
                    </select>
                </div>
                <div style="height:12px"></div>
                <div class="label">承讓數招：</div>
                <div>
                    <select id="selHandicap" style="padding:0px">
                        <option selected value="0">
                            不讓
                        </option>
                        <option value="1">
                            讓左馬
                        </option>
                        <option value="2">
                            讓雙馬
                        </option>
                        <option value="3">
                            讓九子千軍
                        </option>
                    </select>
                </div>
                <div style="height:12px"></div>
                <div class="label">神拳霸腿：</div>
                <div>
                    <select id="selLevel" size="3" onchange="level_change()">
                        <option selected value="0">
                            初出茅廬，不學無術
                        </option>
                        <option value="1">
                            江湖郎中，騙吃騙喝
                        </option>
                        <option value="2">
                            道上兄弟，武林宗師
                        </option>
                    </select>
                </div>
                <div style="height:12px"></div>
                <div style="padding-top:2px"><input type="button" class="button" value="永不認輸，重新再打" onclick="restart_click()"></div>
                <div style="padding-top:2px"><input type="button" class="button" value="認輸一次，我要悔棋" onclick="retract_click()"></div>
                <div style="height:12px"></div>
                <div><input type="checkbox" class="checkbox" id="chkAnimated" checked onclick="board.animated = checked"><label for="chkAnimated">Animation</label></input></div>
                <div><input type="checkbox" class="checkbox" checked onclick="board.setSound(checked)"><label for="chkSound">Sound</label></input></div>
                <div style="height:12px"></div>
                <div class="label">Steps</div>
                <div>
                    <select id="selMoveList" size="10" onchange="moveList_change()">
                        <option selected value="0">@_@</option>
                    </select>
                </div>
            </div>
        </span>
    </div>
    <script type="text/javascript">
<!--

        "use strict";
        console.log("HTML");

        var STARTUP_FEN = [
            "rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w",
            "rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKAB1R w",
            "rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/R1BAKAB1R w",
            "rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/9/1C5C1/9/RN2K2NR w",
        ];

        function createOption(text, value, ie8) {
            var opt = document.createElement("option");
            opt.selected = true;
            opt.value = value;
            if (ie8) {
                opt.text = text;
            } else {
                opt.innerHTML = text.replace(/ /g, "&nbsp;");
            }
            return opt;
        }

        console.log("Program started");

        var board = new Board(container, "images/", "sounds/");
        board.setSearch(16);
        board.millis = 10;
        board.computer = 1;

        board.onAddMove = function () {
            var counter = (board.pos.mvList.length >> 1);
            var space = (counter > 99 ? "      " : "     ");
            counter = (counter > 9 ? "" : " ") + counter + ". ";
            var sqSrc = SRC(board.mvLast);
            var sqDst = DST(board.mvLast);
            var text = PIECE_NAME[board.pos.squares[sqDst]];
            text = (board.pos.sdPlayer == 0 ? space : counter) + move2IccsTW(text, sqSrc, sqDst);
            var value = "" + board.mvLast;
            try {
                selMoveList.add(createOption(text, value, false));
            } catch (e) {
                selMoveList.add(createOption(text, value, true));
            }
            selMoveList.scrollTop = selMoveList.scrollHeight;
        };

        function level_change() {
            board.millis = Math.pow(10, selLevel.selectedIndex + 1);
        }

        function restart_click() {
            selMoveList.options.length = 1;
            selMoveList.selectedIndex = 0;
            board.computer = 1 - selMoveMode.selectedIndex;
            console.log("[restart] computer:" + board.computer);
            // board.restart(PUZZLE_LIST[0]);
            board.restart(STARTUP_FEN[selHandicap.selectedIndex]);
        }

        function retract_click() {
            for (var i = board.pos.mvList.length; i < selMoveList.options.length; i++) {
                board.pos.makeMove(parseInt(selMoveList.options[i].value));
            }
            board.retract();
            selMoveList.options.length = board.pos.mvList.length;
            selMoveList.selectedIndex = selMoveList.options.length - 1;
        }

        function moveList_change() {
            if (board.result == RESULT_UNKNOWN) {
                selMoveList.selectedIndex = selMoveList.options.length - 1;
                return;
            }
            var from = board.pos.mvList.length;
            var to = selMoveList.selectedIndex;
            if (from == to + 1) {
                return;
            }
            if (from > to + 1) {
                for (var i = to + 1; i < from; i++) {
                    board.pos.undoMakeMove();
                }
            } else {
                for (var i = from; i <= to; i++) {
                    board.pos.makeMove(parseInt(selMoveList.options[i].value));
                }
            }
            board.flushBoard();
        }
        --></script>
</body>
</html>
